[target.thumbv7em-none-eabihf]
runner = "npx --yes -- nwlink install-nwa --external-data target/ereader/library.nwlib"
rustflags = ["-C", "link-arg=--relocatable", "-C", "link-arg=-no-gc-sections"]

[alias]
sim = "run --manifest-path xtask/Cargo.toml -- sim"
deploy = "run --manifest-path xtask/Cargo.toml -- deploy"